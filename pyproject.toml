[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "englishnotes"
version = "0.2.0"
description = "Offline-first desktop notes for English lessons"
requires-python = ">=3.14"
dependencies = ["PySide6>=6.10,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-qt>=4.5,<5", "ruff>=0.14,<1"]
build = ["pyinstaller>=6.16,<7"]

[project.gui-scripts]
englishnotes = "englishnotes.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
