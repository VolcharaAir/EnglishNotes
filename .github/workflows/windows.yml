name: Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra build
      - name: Check formatting and lint
        run: |
          uv run --no-sync ruff check src tests tools packaging
          uv run --no-sync ruff format --check src tests tools packaging
      - name: Test before building
        run: uv run --no-sync pytest -q --junitxml=work/test-results.xml
      - name: Build standalone GUI EXE
        run: uv run --no-sync python -m PyInstaller --clean --noconfirm EnglishNotes.spec
      - name: Smoke test actual EXE on Windows
        env:
          QT_QPA_PLATFORM: windows
        run: uv run --no-sync python tools/smoke_windows.py dist/EnglishNotes.exe
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/EnglishNotes.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  EnglishNotes.exe" | Out-File dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishNotes-Windows-x64
          path: |
            dist/EnglishNotes.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-test-results
          path: work/test-results.xml
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EnglishNotes-Windows-x64
          path: dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/EnglishNotes.exe dist/SHA256SUMS.txt
          --verify-tag --title "EnglishNotes $RELEASE_TAG"
          --notes "Windows x64. Download EnglishNotes.exe and run it. Python is not required. Local notes are stored in your Windows user profile. Cloud sync is not included."
